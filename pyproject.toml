[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "imbcal"
version = "0.3.1"
description = "Calibrated probability estimation under class imbalance: safe pipelines, prevalence-preserving augmentation and diagnostics"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Rolando de la Cruz", email = "rolando.delacruz@uai.cl"}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.6"]
keywords = ["calibration", "class imbalance", "SMOTE", "synthetic data", "recalibration", "scikit-learn", "risk prediction"]
classifiers = ["Development Status :: 3 - Alpha", "Intended Audience :: Science/Research",
               "Operating System :: OS Independent",
               "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.10",
               "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12",
               "Programming Language :: Python :: 3.13",
               "Topic :: Scientific/Engineering :: Artificial Intelligence",
               "Topic :: Scientific/Engineering :: Mathematics"]

[project.urls]
Homepage = "https://github.com/rolandodelacruz74/imbcal"
Repository = "https://github.com/rolandodelacruz74/imbcal"
Issues = "https://github.com/rolandodelacruz74/imbcal/issues"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
